[tool.poetry]
name = "agro-iot-service"
version = "0.1.0"
description = "IoT-приёмник датчиков и метеостанций для платформы Agro Digital Twin"
authors = ["Victor"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.110.3"
uvicorn = {extras = ["standard"], version = "^0.29.0"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0.29"}
asyncpg = "^0.29.0"
alembic = "^1.13.1"
pydantic-settings = "^2.2.1"
httpx = "^0.27.0"
shapely = "^2.0.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
